{% extends "layout.html" %}
{% block judul %}Akun{% endblock %}
{% block eyebrow %}Sistem{% endblock %}
{% block tajuk %}Akun{% endblock %}
{% block isi %}
<form method="post">

  <section class="panel" style="max-width:38rem">
    <div class="panel__head"><h2 class="panel__title">Identitas</h2></div>
    <div class="panel__body">
      <div class="grid">
        <div class="field">
          <label class="field__label" for="nama">Nama</label>
          <input id="nama" name="nama" value="{{ pengguna.nama }}" required>
          <span class="field__hint"></span>
        </div>
        <div class="field">
          <label class="field__label" for="un">Username</label>
          <input id="un" name="username" value="{{ pengguna.username }}" required>
          <span class="field__hint"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" style="max-width:38rem">
    <div class="panel__head"><h2 class="panel__title">Ganti sandi</h2></div>
    <div class="panel__body">
      <p class="hint">Kosongkan bila tidak ingin mengganti sandi.</p>
      <div class="grid">
        <div class="field">
          <label class="field__label" for="sl">Sandi lama</label>
          <input id="sl" type="password" name="sandi_lama" autocomplete="current-password">
          <span class="field__hint"></span>
        </div>
        <div class="field">
          <label class="field__label" for="sb">Sandi baru</label>
          <input id="sb" type="password" name="sandi_baru" autocomplete="new-password">
          <span class="field__hint">Minimal 6 karakter.</span>
        </div>
        <div class="field">
          <label class="field__label" for="su">Ulangi sandi baru</label>
          <input id="su" type="password" name="sandi_ulang" autocomplete="new-password">
          <span class="field__hint"></span>
        </div>
      </div>
    </div>
  </section>

  <div class="btn-row"><button class="btn btn--primary">Simpan</button></div>
</form>
{% endblock %}
