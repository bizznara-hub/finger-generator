{% extends "layout.html" %}
{% block judul %}Akun{% endblock %}
{% block tajuk %}Akun{% endblock %}
{% block subtajuk %}identitas dan sandi{% endblock %}
{% block isi %}
<form method="post" class="form-horizontal">
  <h4 class="header blue bolder smaller">Identitas</h4>

  <div class="form-group">
    <label class="col-sm-3 control-label no-padding-right">Nama</label>
    <div class="col-sm-6"><input name="nama" class="form-control" value="{{ pengguna.nama }}" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label no-padding-right">Username</label>
    <div class="col-sm-6"><input name="username" class="form-control" value="{{ pengguna.username }}" required></div>
  </div>

  <h4 class="header blue bolder smaller">Ganti sandi</h4>
  <p class="col-sm-offset-3 col-sm-6 redup">Kosongkan bila tidak ingin mengganti sandi.</p>

  <div class="form-group">
    <label class="col-sm-3 control-label no-padding-right">Sandi lama</label>
    <div class="col-sm-6"><input type="password" name="sandi_lama" class="form-control" autocomplete="current-password"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label no-padding-right">Sandi baru</label>
    <div class="col-sm-6"><input type="password" name="sandi_baru" class="form-control" autocomplete="new-password"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label no-padding-right">Ulangi sandi baru</label>
    <div class="col-sm-6"><input type="password" name="sandi_ulang" class="form-control" autocomplete="new-password"></div>
  </div>

  <div class="clearfix form-actions">
    <div class="col-md-offset-3 col-md-9">
      <button class="btn btn-sm btn-primary"><i class="ace-icon fa fa-check"></i> Simpan</button>
    </div>
  </div>
</form>
{% endblock %}
