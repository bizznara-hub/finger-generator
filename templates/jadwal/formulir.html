{% extends "layout.html" %}
{% block judul %}Blok{% endblock %}
{% block eyebrow %}Kegiatan · Jadwal Kuliah{% endblock %}
{% block tajuk %}{{ 'Ubah blok' if obj.id else 'Tambah blok' }}{% endblock %}
{% block isi %}
<form method="post">
  <section class="panel" style="max-width:38rem">
    <div class="panel__body">
      <div class="grid">
        <div class="field">
          <label class="field__label" for="mk">Mata kuliah / blok <span class="field__req">*</span></label>
          <select id="mk" name="mata_kuliah_id">
            <option value="">— pilih —</option>
            {% for mk in mata_kuliah %}
              <option value="{{ mk.id }}" {{ 'selected' if obj.mata_kuliah_id == mk.id }}>{{ mk.nama }}</option>
            {% endfor %}
          </select>
          <span class="field__hint"></span>
        </div>
        <div class="field">
          <label class="field__label" for="sem">Semester</label>
          <input id="sem" name="semester" value="{{ obj.semester or '' }}" placeholder="Akhir">
          <span class="field__hint">Masuk ke baris pertama kop laporan.</span>
        </div>
        <div class="field field--mono">
          <label class="field__label" for="ta">Tahun ajaran</label>
          <input id="ta" name="tahun_ajaran" value="{{ obj.tahun_ajaran or '' }}" placeholder="2025/2026">
          <span class="field__hint"></span>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn--primary">Simpan</button>
        <a class="btn" href="{{ url_for('jadwal.daftar') }}">Batal</a>
      </div>
    </div>
  </section>
</form>
{% endblock %}
