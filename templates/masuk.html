<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Absensi FK Unhas</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="masuk">
  <form class="masuk__box" method="post">
    <span class="masuk__mark eyebrow">Absensi FK · Universitas Hasanuddin</span>
    <h1 class="masuk__title">Masuk</h1>

    {% if galat %}
      <div class="note note--bad" role="alert">
        <span class="note__mark">Galat</span><span>{{ galat }}</span>
      </div>
    {% endif %}

    <div class="field">
      <label class="field__label" for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
    </div>

    <div class="field">
      <label class="field__label" for="sandi">Sandi</label>
      <input id="sandi" type="password" name="sandi" autocomplete="current-password" required>
    </div>

    <button class="btn btn--primary">Masuk</button>
  </form>
</div>
</body>
</html>
